<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miami Air Quality Forecast</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Miami AQI Forecast</h1>
            <p>Predicting PM2.5 levels using Machine Learning</p>
        </header>

        <div class="dashboard">
            <div class="card status-card">
                <h3>Tomorrow's Prediction</h3>
                <div class="aqi-display" id="tomorrowAqi">--</div>
                <div class="aqi-status" id="tomorrowStatus">Loading...</div>
            </div>

            <div class="card chart-card">
                <h3>7-Day AQI Forecast</h3>
                <canvas id="aqiChart"></canvas>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
