<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Predictor in Miami</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        miamiDark: '#0f0c29',
                        miamiDeep: '#302b63',
                        miamiPink: '#ff0844',
                        miamiCyan: '#00d2ff',
                        glassBg: 'rgba(255, 255, 255, 0.03)'
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased min-h-screen relative overflow-x-hidden text-gray-100">

    <!-- Ambient Miami Background -->
    <div class="fixed inset-0 z-[-1] bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-20 pointer-events-none"></div>
    <div class="bg-orb orb-pink"></div>
    <div class="bg-orb orb-cyan"></div>

    <nav class="fixed w-full z-50 top-0 bg-miamiDark/60 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-miamiPink to-orange-400 flex items-center justify-center shadow-[0_0_20px_rgba(255,8,68,0.5)]">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
                </div>
                <span class="text-2xl font-bold tracking-wider text-white uppercase">Air Predictor <span class="text-transparent bg-clip-text bg-gradient-to-r from-miamiPink to-orange-400">in Miami</span></span>
            </div>
            <div class="hidden sm:flex px-4 py-1.5 rounded-full border border-white/10 bg-white/5 items-center gap-2 text-sm font-medium">
                <div class="w-2 h-2 rounded-full bg-miamiCyan animate-pulse"></div>
                AI Sensor Grid Online
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto pt-32 pb-20 px-6 relative z-10">
        
        <header class="text-center mb-16">
            <h1 class="text-4xl md:text-6xl font-extrabold mb-4 tracking-tight">
                Tropical PM2.5 <span class="text-transparent bg-clip-text bg-gradient-to-r from-miamiCyan to-blue-500">Forecasting</span>
            </h1>
            <p class="text-lg text-blue-200/60 max-w-2xl mx-auto font-light">
                Advanced machine learning engine predicting coastal air quality fluctuations based on temporal patterns.
            </p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- STATUS PANEL -->
            <div class="lg:col-span-4 flex flex-col gap-8">
                <div class="glass-card p-8 rounded-3xl relative overflow-hidden h-full flex flex-col justify-center items-center text-center">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-miamiPink opacity-10 rounded-full blur-3xl"></div>
                    
                    <h3 class="text-sm font-bold uppercase tracking-widest text-gray-400 mb-6">Tomorrow's Prediction</h3>
                    
                    <div class="relative mb-6 group">
                        <div class="absolute inset-0 bg-gradient-to-r from-miamiPink to-miamiCyan rounded-full blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                        <div class="relative bg-miamiDark/80 w-48 h-48 rounded-full border border-white/10 flex flex-col justify-center items-center">
                            <span class="text-6xl font-extrabold text-white" id="tomorrowAqi">--</span>
                            <span class="text-sm text-gray-400 mt-1 uppercase tracking-wider">AQI Level</span>
                        </div>
                    </div>

                    <div id="tomorrowStatus" class="px-6 py-2 rounded-full font-bold uppercase tracking-widest text-sm shadow-[0_0_20px_rgba(255,255,255,0.1)] border border-white/10 bg-white/5 transition-all duration-300">
                        Scanning Atmosphere...
                    </div>
                </div>
            </div>

            <!-- CHART PANEL -->
            <div class="lg:col-span-8">
                <div class="glass-card p-8 rounded-3xl h-full min-h-[400px] flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                            <span>📡</span> 7-Day Forecasting Radar
                        </h3>
                        <div class="flex gap-2">
                            <span class="px-3 py-1 text-xs rounded-lg bg-gray-500/20 border border-gray-500/30 text-gray-300">Historical</span>
                            <span class="px-3 py-1 text-xs rounded-lg bg-miamiCyan/20 border border-miamiCyan/30 text-miamiCyan">Forecast</span>
                        </div>
                    </div>
                    <div class="flex-grow relative w-full h-full">
                        <canvas id="aqiChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
